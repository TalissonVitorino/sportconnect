# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# Targets iOS nao rodam em Linux/Windows; suprime o aviso
kotlin.native.ignoreDisabledTargets=true

# Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# SportConnect: alvo Android HABILITADO por padrao.
# Em maquinas sem Android SDK (CI de desktop/web, containers), desabilite com
#   ./gradlew <tarefa> -PdisableAndroid=true
# ou adicionando `disableAndroid=true` em ~/.gradle/gradle.properties (nao versionado).
disableAndroid=false

# Versão do app (fonte única): versionName do Android e AppInfo.VERSION_NAME no código compartilhado.
# No iOS, MARKETING_VERSION em iosApp/Configuration/Config.xcconfig deve acompanhar.
sportconnect.versionName=0.1.0
sportconnect.versionCode=1
