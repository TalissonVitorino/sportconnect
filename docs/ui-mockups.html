:root {
  --fd: "Saira Condensed", "Roboto Condensed", sans-serif;
  --ft: "Atkinson Hyperlegible Next", Roboto, system-ui, sans-serif;
  --fm: "Atkinson Hyperlegible Mono", ui-monospace, monospace;
  --apito: cubic-bezier(.34,1.4,.64,1);
  --std: cubic-bezier(.2,0,0,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--surfaceContainer); color: var(--onSurface); font: 400 16px/24px var(--ft); letter-spacing: .15px; -webkit-font-smoothing: antialiased; }
.ms { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24; flex: none; -webkit-font-smoothing: antialiased; }
.ms.f { font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; }
.ms.s16 { font-size: 16px; font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 20; }
.ms.s20 { font-size: 20px; font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 20; }
.ms.s16.f, .ms.s20.f { font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 20; }

/* Tipografia (05 §5.2) */
.dl { font: 700 60px/64px var(--fd); letter-spacing: -.5px; }
.ds { font: 700 38px/44px var(--fd); }
.hl { font: 600 34px/40px var(--fd); }
.hm { font: 600 30px/36px var(--fd); }
.hs { font: 600 26px/32px var(--fd); }
.tl { font: 700 22px/28px var(--ft); }
.tm { font: 700 16px/24px var(--ft); letter-spacing: .15px; }
.ts { font: 700 14px/20px var(--ft); letter-spacing: .1px; }
.bl { font: 400 16px/24px var(--ft); letter-spacing: .15px; }
.bm { font: 400 14px/20px var(--ft); letter-spacing: .25px; }
.bs { font: 400 12px/16px var(--ft); letter-spacing: .4px; }
.ll { font: 600 14px/20px var(--ft); letter-spacing: .1px; }
.lm { font: 600 12px/16px var(--ft); letter-spacing: .5px; }
.lsm { font: 600 11px/16px var(--ft); letter-spacing: .5px; }
.nscore { font: 700 44px/48px var(--fd); font-feature-settings: "tnum"; }
.nprice { font: 700 28px/32px var(--fd); font-feature-settings: "tnum"; }
.nprice20 { font: 700 20px/24px var(--fd); font-feature-settings: "tnum"; }
.pixcode { font: 500 13px/20px var(--fm); }
.tnum { font-feature-settings: "tnum"; }
.v { color: var(--onSurfaceVariant); }
.pri { color: var(--primary); }
.m0 { margin: 0; }

/* ---------- Página (prancha) ---------- */
.board-head { max-width: 1840px; margin: 0 auto; padding: 40px 48px 8px; display: flex; gap: 32px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.board-head img { height: 40px; display: block; }
.board-head h1 { font: 700 48px/52px var(--fd); margin: 20px 0 4px; letter-spacing: -.25px; }
.board-head p { margin: 0; max-width: 72ch; color: var(--onSurfaceVariant); }
.toggle { display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--outline); background: var(--surfaceContainerLowest); color: var(--onSurface); font: 600 14px/20px var(--ft); cursor: pointer; }
.toggle:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.t-dark .board-head .logo-light { display: none; }
.board-head .logo-dark { display: none; }
.t-dark .board-head .logo-dark { display: block; }
.board { max-width: 1840px; margin: 0 auto; padding: 32px 48px 64px; display: flex; flex-wrap: wrap; gap: 56px 48px; }
figure.shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
figure.shot figcaption { max-width: 390px; }
figure.shot figcaption b { display: block; font: 700 16px/24px var(--ft); }
figure.shot figcaption code { font: 500 13px/20px var(--fm); color: var(--onSurfaceVariant); }
figure.shot figcaption span { display: block; color: var(--onSurfaceVariant); font: 400 14px/20px var(--ft); margin-top: 2px; }
.wide { flex-basis: 100%; }

/* ---------- Moldura de celular 390 × 844 ---------- */
.phone { width: 390px; height: 844px; border-radius: 48px; background: #191C19; padding: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 24px 48px -24px rgba(0,0,0,.35); flex: none; }
.screen { position: relative; width: 370px; height: 824px; border-radius: 38px; overflow: hidden; background: var(--surface); color: var(--onSurface); display: flex; flex-direction: column; }
.sbar { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 28px 0 32px; font: 600 15px/1 var(--ft); color: var(--onSurface); }
.sbar .icons { display: flex; gap: 6px; align-items: center; }
.sbar .icons .ms { font-size: 18px; }
.island { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 112px; height: 30px; background: #000; border-radius: 16px; z-index: 30; }
.body { flex: 1; overflow: hidden; position: relative; }
.pad { padding: 0 16px; }
.gesture { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--onSurface); opacity: .85; z-index: 40; }

/* Top bar */
.topbar { height: 64px; display: flex; align-items: center; gap: 4px; padding: 0 4px; flex: none; }
.topbar .title { flex: 1; font: 700 22px/28px var(--ft); padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 48px; height: 48px; border-radius: 9999px; display: grid; place-items: center; color: var(--onSurfaceVariant); position: relative; }
.iconbtn .dot { position: absolute; top: 8px; right: 8px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--error); color: var(--onError); font: 600 11px/16px var(--ft); text-align: center; }

/* Botões (06 §5.1) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 24px; border-radius: 12px; font: 600 14px/20px var(--ft); letter-spacing: .1px; border: 0; white-space: nowrap; }
.btn.lg { height: 56px; }
.btn.sm { height: 40px; padding: 0 16px; }
.btn.full { display: flex; width: 100%; }
.btn.primary { background: var(--primary); color: var(--onPrimary); }
.btn.tonal { background: var(--primaryContainer); color: var(--onPrimaryContainer); }
.btn.secondary { background: transparent; color: var(--primary); box-shadow: inset 0 0 0 1px var(--outline); }
.btn.text { background: transparent; color: var(--primary); padding: 0 12px; }
.btn.text.err { color: var(--error); }
.btn .ms { font-size: 20px; }
.btn.lg .ms { font-size: 24px; }

/* Badges (06 §5.4, 05 §3.8) */
.badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 4px; font: 600 12px/16px var(--ft); letter-spacing: .5px; white-space: nowrap; }
.badge .ms { font-size: 16px; }
.badge.lg { height: 32px; padding: 0 12px; }
.badge.lg .ms { font-size: 20px; }
.b-wait { background: var(--bk-aguardando-pagamento-bg); color: var(--bk-aguardando-pagamento-fg); }
.b-ok { background: var(--bk-confirmado-bg); color: var(--bk-confirmado-fg); }
.b-run { background: var(--tertiaryContainer); color: var(--onTertiaryContainer); }
.b-block { background: var(--surfaceContainerHighest); color: var(--onSurfaceVariant); }
.tag-org { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 4px; background: var(--secondaryContainer); color: var(--onSecondaryContainer); font: 600 12px/16px var(--ft); letter-spacing: .5px; }

/* Chips de esporte (06 §5.3) */
.chip { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px 0 8px; border-radius: 8px; font: 600 12px/16px var(--ft); letter-spacing: .5px; white-space: nowrap; }
.chip .ms { font-size: 20px; }
.sp-soc { background: var(--sp-futebol-society-container); color: var(--sp-futebol-society-oncontainer); }
.sp-bt { background: var(--sp-beach-tennis-container); color: var(--sp-beach-tennis-oncontainer); }
.sp-vol { background: var(--sp-volei-container); color: var(--sp-volei-oncontainer); }
.sp-fs { background: var(--sp-futsal-container); color: var(--sp-futsal-oncontainer); }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px 0 12px; border-radius: 8px; border: 1px solid var(--outline); background: var(--surfaceContainerLowest); color: var(--onSurfaceVariant); font: 600 12px/16px var(--ft); letter-spacing: .5px; white-space: nowrap; flex: none; }
.fchip.on { background: var(--sp-futebol-society-container); color: var(--sp-futebol-society-oncontainer); border: 2px solid var(--sp-futebol-society-accent); }
.fchip.plain.on { background: var(--secondaryContainer); color: var(--onSecondaryContainer); border: 0; }
.fchip .ms { font-size: 18px; }

/* Cards */
.gcard { position: relative; background: var(--surfaceContainerLowest); border: 1px solid var(--outlineVariant); border-radius: 24px; padding: 16px 16px 16px 20px; overflow: hidden; }
.gcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--acc, var(--sp-futebol-society-accent)); }
.row { display: flex; align-items: center; gap: 8px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.meta { display: flex; align-items: center; gap: 8px; color: var(--onSurfaceVariant); font: 400 14px/20px var(--ft); letter-spacing: .25px; }
.meta .ms { font-size: 20px; }
.sec { font: 700 14px/20px var(--ft); letter-spacing: .1px; color: var(--onSurfaceVariant); margin: 24px 0 8px; }

/* Rateio (06 §5.8) */
.track { display: flex; gap: 3px; height: 10px; }
.track.c { height: 6px; }
.track i { flex: 1; border-radius: 2px; background: var(--surfaceContainerHighest); box-shadow: inset 0 0 0 1px var(--outline); }
.track i:first-child { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
.track i:last-child { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
.track i.p { background: var(--primary); box-shadow: none; }
.track i.pr { box-shadow: none; background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--primary) 40%, transparent) 0 3px, color-mix(in srgb, var(--primary) 18%, transparent) 3px 6px); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font: 600 12px/16px var(--ft); letter-spacing: .5px; color: var(--onSurfaceVariant); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }

/* Bottom nav (06 §5.15) */
.bnav { height: 80px; flex: none; background: var(--surfaceContainer); display: flex; padding: 12px 8px 16px; }
.bnav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--onSurfaceVariant); font: 600 11px/16px var(--ft); letter-spacing: .5px; text-decoration: none; }
.bnav .ind { width: 64px; height: 32px; border-radius: 9999px; display: grid; place-items: center; position: relative; }
.bnav a.on { color: var(--onSurface); }
.bnav a.on .ind { background: var(--primaryContainer); color: var(--onPrimaryContainer); }
.bnav .bdg { position: absolute; top: 0; left: 36px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--error); color: var(--onError); font: 600 11px/16px var(--ft); text-align: center; }

/* FAB */
.fab { position: absolute; right: 16px; bottom: 96px; height: 56px; padding: 0 20px 0 16px; border-radius: 9999px; background: var(--primaryContainer); color: var(--onPrimaryContainer); display: inline-flex; align-items: center; gap: 12px; font: 600 14px/20px var(--ft); box-shadow: 0 3px 6px rgba(0,0,0,.18), 0 6px 12px -4px rgba(0,0,0,.18); z-index: 5; }

/* Rodapé fixo */
.foot { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--outlineVariant); padding: 16px 16px 28px; z-index: 6; }

/* Contador */
.timer-warn { color: var(--warning); }
.timer-chip { display: inline-flex; align-items: center; gap: 4px; font: 600 14px/20px var(--ft); font-feature-settings: "tnum"; }

/* Participantes */
.prow { height: 64px; display: flex; align-items: center; gap: 16px; }
.prow.self { background: var(--surfaceContainerLow); margin: 0 -16px; padding: 0 16px; }
.av { width: 40px; height: 40px; border-radius: 9999px; display: grid; place-items: center; font: 700 14px/1 var(--ft); flex: none; background: var(--sp-futebol-society-container); color: var(--sp-futebol-society-oncontainer); }
.av.sm { width: 32px; height: 32px; font-size: 12px; }
.av.open { background: transparent; border: 1.5px dashed var(--outline); color: var(--onSurfaceVariant); }
.prow .who { flex: 1; min-width: 0; }
.st { display: flex; align-items: center; gap: 4px; font: 400 12px/16px var(--ft); letter-spacing: .4px; color: var(--onSurfaceVariant); }
.st .ms { font-size: 16px; }
.st.ok { color: var(--success); }
.st.wait { color: var(--warning); }

/* Slots (06 §5.7, 05 §3.9) */
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.slot { position: relative; min-height: 56px; border-radius: 12px; padding: 8px 12px; background: var(--slot-disponivel-bg); color: var(--slot-disponivel-fg); box-shadow: inset 0 0 0 1px var(--slot-disponivel-bd); }
.slot .ms { position: absolute; top: 8px; right: 8px; font-size: 16px; }
.slot.busy { background: var(--slot-ocupado-bg) repeating-linear-gradient(45deg, var(--outlineVariant) 0 1px, transparent 1px 6px); color: var(--slot-ocupado-fg); box-shadow: none; }
.slot.busy { background-color: var(--slot-ocupado-bg); }
.slot.hold { background: var(--slot-pre-reservado-bg); color: var(--slot-pre-reservado-fg); box-shadow: inset 0 0 0 1px var(--slot-pre-reservado-bd); }
.slot.sel { background: var(--slot-selecionado-bg); color: var(--slot-selecionado-fg); box-shadow: none; }
.days { display: flex; gap: 8px; overflow: hidden; }
.day { width: 56px; height: 64px; flex: none; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--surfaceContainerLowest); box-shadow: inset 0 0 0 1px var(--outline); }
.day.on { background: var(--primary); color: var(--onPrimary); box-shadow: none; }
.segm { display: inline-flex; height: 40px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--outline); overflow: hidden; }
.segm > span { min-width: 64px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; font: 600 14px/20px var(--ft); }
.segm > span + span { border-left: 1px solid var(--outline); }
.segm > span.on { background: var(--secondaryContainer); color: var(--onSecondaryContainer); }

/* Stepper (criar jogo) */
.stepper { display: flex; align-items: flex-start; padding: 4px 16px 0; }
.stepper .st-i { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; flex: none; text-align: center; }
.stepper .st-c { width: 24px; height: 24px; border-radius: 9999px; display: grid; place-items: center; font: 700 12px/1 var(--ft); background: var(--primary); color: var(--onPrimary); }
.stepper .st-c.todo { background: transparent; box-shadow: inset 0 0 0 2px var(--outline); color: var(--onSurfaceVariant); }
.stepper .st-c .ms { font-size: 16px; }
.stepper .ln { flex: 1; height: 2px; background: var(--primary); margin-top: 11px; }
.stepper .ln.todo { background: var(--outlineVariant); }
.stepper .lab { font: 600 11px/14px var(--ft); letter-spacing: .3px; color: var(--onSurfaceVariant); }
.stepper .lab.cur { color: var(--onSurface); }
.rule { position: relative; border-radius: 16px; background: var(--surfaceContainerLowest); box-shadow: inset 0 0 0 1px var(--outlineVariant); padding: 16px 16px 16px 52px; }
.rule.on { box-shadow: inset 0 0 0 2px var(--primary); background: color-mix(in srgb, var(--primaryContainer) 12%, var(--surfaceContainerLowest)); }
.radio { position: absolute; left: 16px; top: 18px; width: 20px; height: 20px; border-radius: 9999px; box-shadow: inset 0 0 0 2px var(--onSurfaceVariant); }
.radio.on { box-shadow: inset 0 0 0 2px var(--primary); }
.radio.on::after { content: ""; position: absolute; inset: 5px; border-radius: 9999px; background: var(--primary); }
.radio.in { position: relative; left: auto; top: auto; flex: none; margin-top: 2px; }
.rule .info { position: absolute; right: 4px; top: 4px; }
.sub-opt { display: flex; gap: 12px; padding: 10px 0; }
.chip-rec { display: inline-flex; height: 24px; align-items: center; padding: 0 8px; border-radius: 4px; background: var(--secondaryContainer); color: var(--onSecondaryContainer); font: 600 12px/16px var(--ft); letter-spacing: .5px; }

/* Pix */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.32); z-index: 10; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 96px; background: var(--surfaceContainerLow); border-radius: 28px 28px 0 0; z-index: 11; padding: 16px 20px 0; overflow: hidden; }
.handle { width: 32px; height: 4px; border-radius: 2px; background: var(--outlineVariant); margin: 0 auto 16px; }
.codebox { display: flex; gap: 4px; align-items: flex-start; background: var(--surfaceContainerLowest); border: 1px solid var(--outlineVariant); border-radius: 12px; padding: 12px 4px 12px 12px; }
.codebox .pixcode { flex: 1; word-break: break-all; max-height: 40px; overflow: hidden; }
.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; gap: 4px; }
.steps li { counter-increment: s; display: flex; align-items: center; gap: 12px; min-height: 32px; font: 400 14px/20px var(--ft); letter-spacing: .25px; }
.steps li::before { content: counter(s); width: 24px; height: 24px; border-radius: 9999px; display: grid; place-items: center; background: var(--surfaceContainerHighest); font: 600 12px/1 var(--ft); flex: none; }
.status-box { background: var(--surfaceContainer); border-radius: 16px; padding: 16px; }
.spin { width: 20px; height: 20px; border-radius: 9999px; border: 2.5px solid color-mix(in srgb, var(--primary) 24%, transparent); border-top-color: var(--primary); flex: none; }

/* Convite */
.web-top { height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--outlineVariant); background: var(--surface); }
.web-top img { height: 20px; display: block; }
.hero { position: relative; background: var(--surfaceContainerLow); padding: 24px 16px 20px; overflow: hidden; }
.hero svg.court { position: absolute; right: -60px; top: -10px; width: 260px; height: 220px; }
.share-card { background: var(--surfaceContainerLowest); border: 1px solid var(--outlineVariant); border-radius: 24px; padding: 20px; }
.hr { height: 1px; background: var(--outlineVariant); margin: 16px 0; }

/* Celebração */
.celebrate { position: relative; background: var(--primaryContainer); color: var(--onPrimaryContainer); padding: 8px 16px 48px; overflow: hidden; }
.celebrate svg.court { position: absolute; right: -90px; top: -30px; width: 300px; height: 300px; }
.lift { margin: -24px 16px 0; position: relative; background: var(--surfaceContainerLowest); border-radius: 16px; padding: 16px; box-shadow: inset 0 0 0 1px var(--outlineVariant); }

/* Arena */
.now-row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--outlineVariant); }
.now-row:last-child { border-bottom: 0; }
.now-row .court { width: 80px; flex: none; font: 700 14px/20px var(--ft); padding-top: 2px; }
.alert { display: flex; gap: 12px; align-items: flex-start; background: var(--warningContainer); color: var(--onWarningContainer); border-radius: 16px; padding: 16px; }

/* Desktop expanded */
.desk { width: 1280px; height: 800px; border-radius: 16px; overflow: hidden; background: var(--surface); box-shadow: 0 0 0 1px var(--outlineVariant), 0 24px 48px -24px rgba(0,0,0,.35); display: flex; flex-direction: column; }
.chrome { height: 40px; flex: none; background: var(--surfaceContainerHigh); display: flex; align-items: center; gap: 8px; padding: 0 16px; }
.chrome i { width: 12px; height: 12px; border-radius: 9999px; background: var(--outlineVariant); display: inline-block; }
.chrome .url { margin-left: 16px; height: 26px; border-radius: 13px; background: var(--surfaceContainerLowest); padding: 0 14px; display: inline-flex; align-items: center; font: 400 13px/1 var(--ft); color: var(--onSurfaceVariant); min-width: 420px; }
.desk-main { flex: 1; display: flex; min-height: 0; }
.rail { width: 80px; flex: none; background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 0; border-right: 1px solid var(--outlineVariant); }
.rail a { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--onSurfaceVariant); font: 600 11px/16px var(--ft); letter-spacing: .5px; text-decoration: none; width: 80px; }
.rail .ind { width: 56px; height: 32px; border-radius: 9999px; display: grid; place-items: center; }
.rail a.on { color: var(--onSurface); }
.rail a.on .ind { background: var(--primaryContainer); color: var(--onPrimaryContainer); }
.rail .logo { width: 40px; height: 40px; margin-bottom: 12px; }
.agenda { flex: 1; padding: 20px 24px 0; display: flex; flex-direction: column; min-width: 0; }
.grid { display: grid; grid-template-columns: 56px repeat(4, 1fr); column-gap: 8px; }
.grid .h { height: 48px; display: flex; align-items: center; font: 700 14px/20px var(--ft); position: sticky; top: 0; }
.grid .t { height: 64px; font: 600 12px/16px var(--ft); color: var(--onSurfaceVariant); padding-top: 6px; font-feature-settings: "tnum"; }
.cell { height: 64px; padding: 4px 0; }
.cell > div { height: 56px; border-radius: 12px; padding: 7px 10px; position: relative; overflow: hidden; }
.cell .l1 { display: flex; align-items: center; gap: 4px; font: 600 12px/16px var(--ft); letter-spacing: .3px; white-space: nowrap; }
.cell .l1 .ms { font-size: 16px; }
.cell .l2 { font: 400 12px/16px var(--ft); letter-spacing: .3px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-free { box-shadow: inset 0 0 0 1px var(--outlineVariant); background: var(--surfaceContainerLowest); color: var(--onSurfaceVariant); }
.c-free { background-image: none; }
.c-ok { background: var(--bk-confirmado-bg); color: var(--bk-confirmado-fg); border-left: 4px solid var(--acc); }
.c-run { background: var(--tertiaryContainer); color: var(--onTertiaryContainer); border-left: 4px solid var(--acc); }
.c-hold { background: var(--slot-pre-reservado-bg); color: var(--slot-pre-reservado-fg); border-left: 4px solid var(--acc); }
.c-block { background: var(--surfaceContainerHighest); color: var(--onSurfaceVariant); }
.c-closed { background: var(--surfaceContainer) repeating-linear-gradient(45deg, var(--outlineVariant) 0 1px, transparent 1px 6px); color: var(--onSurfaceVariant); }
.c-sel { box-shadow: 0 0 0 2px var(--primary); }
.side { width: 320px; flex: none; background: var(--surfaceContainerLow); border-left: 1px solid var(--outlineVariant); padding: 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden; }
.nowline { position: absolute; left: 56px; right: 0; height: 2px; background: var(--error); z-index: 3; }
.nowline::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 9999px; background: var(--error); }
.kv { display: flex; justify-content: space-between; gap: 8px; font: 400 14px/20px var(--ft); letter-spacing: .25px; padding: 6px 0; }
.kv b { font-weight: 600; font-feature-settings: "tnum"; }

/* Fotos placeholder de arena (05 §8) */
.ph { position: relative; background: var(--sp-futebol-society-container); overflow: hidden; }
.ph svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.distance { position: absolute; left: 12px; bottom: 12px; height: 24px; padding: 0 8px; border-radius: 4px; background: rgba(0,0,0,.56); color: #fff; font: 600 12px/24px var(--ft); }

@media (prefers-reduced-motion: no-preference) {
  .track i.p.last { animation: fill 300ms var(--apito) both; transform-origin: left; }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
}
</style>

<script>
(function(){
  var root = document.documentElement, btn = document.getElementById('themeToggle'), lab = document.getElementById('themeLabel');
  function apply(dark){
    root.classList.toggle('t-dark', dark);
    btn.setAttribute('aria-pressed', String(dark));
    lab.textContent = dark ? 'Ver tema claro' : 'Ver tema escuro';
    btn.querySelector('.ms').textContent = dark ? 'light_mode' : 'dark_mode';
  }
  btn.addEventListener('click', function(){ apply(!root.classList.contains('t-dark')); });
  if (location.hash === '#dark') apply(true);
})();
</script>
